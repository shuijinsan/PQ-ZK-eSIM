# PQ-ZK-eSIM Artifact metadata（数据来自实验与后端）
# 待最终一致性审核

[artifact]
name = "PQ-ZK-eSIM"
description = "Post-quantum zero-knowledge eSIM authentication: prover/verifier, TEE simulation, QEMU ARM64 evaluation"
badges = ["Available", "Functional", "Reproduced"]  # 待最终确认实际达到后再勾选

[hardware]
os = "Ubuntu 22.04 LTS"
host = "x86_64"
cpu = "4+ cores"
ram = "8 GB"
disk = "20 GB"
emulation = "QEMU ARM64 (qemu-user-static)"
toolchain = "AArch64 cross (gcc-aarch64-linux-gnu)"

[software]
compiler = "gcc/g++ (C11/C++17)"
cmake = ">= 3.22"
crypto = ["OpenSSL 3.0.13", "liboqs 0.15.0"]
python = "Python 3 + numpy/pandas/matplotlib"
profiling = "Valgrind >= 3.20 (Callgrind, claim2)"
security_estimator = "lattice-estimator (commit d2bf9ca) + fpylll (外部，未 vendor)"

