name = "PQ-ZK-eSIM"
version = "camera-ready-k3m8"
artifact_type = "research prototype"
badges = ["Available", "Functional"]

[environment]
os = "Ubuntu 22.04 LTS"
arch = "x86_64 host / AArch64 emulation"
qemu = "qemu-aarch64-static"

[crypto]
N = 256
q = 8380417
k = 3
m = 8
kappa = 35
sigma_pub = 5000
secret_distribution = "uniform ternary {-1,0,1}"
public_matrix = "systematic [Abar|I_3], Abar in R_q^(3x5)"
security_estimator = "lattice-estimator commit 6019056 + fpylll (external, not vendored)"

[claims]
claim1 = "QEMU ARM64 phase timing"
claim2 = "MLWE/MSIS known-attack estimation"
claim3 = "DoS early reject"
claim4 = "sliding-window resynchronization"
claim5 = "sparse-noise multi-norm detection"

[backend]
optional = true
network = "TCP 8000; optional local MySQL 8.0 and Redis"
runtime = "uvicorn main:app --host 0.0.0.0 --port 8000"
